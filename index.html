<!doctype html>
<html lang="en" dir="ltr" data-mantine-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <style>
      @layer mantine, bwf-utils;
    </style>
    <meta http-equiv="content-language" content="en" />
    <link rel="icon" type="image/png" href="/assets/brand/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e8ebef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        var scheme;
        try {
          scheme = JSON.parse(localStorage.getItem('bwf-settings')).state.colorScheme;
        } catch (e) {}
        try {
          if (scheme !== 'light' && scheme !== 'dark')
            scheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,400..900&family=Geist:wght@400;500;600;700&family=Saira:wdth,wght@75..100,500..800&display=swap"
    />
    <title>HSBC BWF World Tour</title>
    <meta
      name="description"
      content="Live scores, draws, results, the season calendar, world rankings and news from the HSBC BWF World Tour, badminton’s top tournament circuit."
    />
    <meta property="og:site_name" content="HSBC BWF World Tour" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="HSBC BWF World Tour" />
    <meta
      property="og:description"
      content="Live scores, draws, results, the season calendar, world rankings and news from the HSBC BWF World Tour, badminton’s top tournament circuit."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="HSBC BWF World Tour" />
    <meta
      name="twitter:description"
      content="Live scores, draws, results, the season calendar, world rankings and news from the HSBC BWF World Tour, badminton’s top tournament circuit."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
