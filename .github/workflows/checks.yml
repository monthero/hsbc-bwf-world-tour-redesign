name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VP_GIT_HOOKS: '0'

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Format, lint and type-aware checks
        run: pnpm exec vp check

      - name: Curated data
        run: pnpm data:check

      - name: Translation catalogs are up to date
        run: |
          pnpm i18n:extract
          git add --intent-to-add -- src/locales
          if ! git diff --exit-code -- src/locales; then
            echo "::error title=Translation catalogs are out of date::Run pnpm i18n:extract and commit the updated files in src/locales."
            exit 1
          fi

      - name: Translations
        run: pnpm i18n:check --fail-on-missing
